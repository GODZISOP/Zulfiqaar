<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" fill="none">
  <defs>
    <linearGradient id="mkbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="mkbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Monogram MKB Graphic Emblem -->
  <g transform="translate(65, 18)">
    <!-- Hexagonal / Shield Base Outline -->
    <path d="M 145 10 L 250 45 L 250 140 L 145 185 L 40 140 L 40 45 Z" fill="url(#mkbBlue)" stroke="url(#mkbGold)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Stylized MKB Interlocking Letters -->
    <!-- M Left Wing -->
    <path d="M 70 135 L 70 65 L 105 110 L 145 65 L 145 135 L 125 135 L 125 95 L 105 125 L 90 125 L 90 135 Z" fill="#ffffff"/>
    
    <!-- K and B Dynamic Overlays -->
    <path d="M 155 65 L 175 65 L 175 95 L 210 65 L 230 65 L 195 100 L 232 135 L 208 135 L 175 105 L 175 135 L 155 135 Z" fill="url(#mkbGold)"/>
    
    <!-- Dynamic Orbit / Swoosh Ring representing Global Reach -->
    <path d="M 25 105 C 50 155, 235 170, 265 95 C 240 115, 115 125, 38 102 Z" fill="url(#swooshGrad)" opacity="0.95"/>
  </g>

  <!-- Brand Typography: MKB VENTURES -->
  <text x="210" y="235" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="3">
    MKB VENTURES
  </text>

  <!-- Subtitle: — GLOBAL LLC — -->
  <g transform="translate(210, 263)">
    <line x1="-80" y1="-5" x2="-35" y2="-5" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#d97706" letter-spacing="4">
      GLOBAL LLC
    </text>
    <line x1="35" y1="-5" x2="80" y2="-5" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
